mark_message_read:
  target:
    entity:
      integration: fritzbox_phone
      domain: sensor
  fields:
    message_index:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 999
          mode: box
    message_key:
      required: false
      example: "01.01.26 10:00|0301234567"
      selector:
        text:
    read:
      required: false
      default: true
      selector:
        boolean:

delete_message:
  target:
    entity:
      integration: fritzbox_phone
      domain: sensor
  fields:
    message_index:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 999
          mode: box
    message_key:
      required: false
      example: "01.01.26 10:00|0301234567"
      selector:
        text:

play_message:
  target:
    entity:
      integration: fritzbox_phone
      domain: sensor
  fields:
    message_index:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 999
          mode: box
    message_key:
      required: false
      example: "01.01.26 10:00|0301234567"
      selector:
        text:
    media_player:
      required: true
      selector:
        entity:
          domain: media_player

dial:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    number:
      required: true
      example: "030 123456"
      selector:
        text:
    max_ring_seconds:
      required: false
      example: 15
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds

hangup:
  target:
    entity:
      integration: fritzbox_phone

lookup_number:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    number:
      required: true
      example: "+49 30 123456"
      selector:
        text:

add_contact:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    name:
      required: true
      example: "Dr. Weber (Praxis)"
      selector:
        text:
    number:
      required: false
      example: "030 123456"
      selector:
        text:
    numbers:
      required: false
      example: '[{"number": "030 123456", "type": "work"}, {"number": "0170 1234567", "type": "mobile"}]'
      selector:
        object:
    emails:
      required: false
      example: '["weber@example.com"]'
      selector:
        object:
    vip:
      required: false
      default: false
      selector:
        boolean:
    phonebook_id:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
          mode: box

update_contact:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    contact_id:
      required: true
      example: "12"
      selector:
        text:
    name:
      required: true
      example: "Dr. Weber (Praxis)"
      selector:
        text:
    numbers:
      required: true
      example: '[{"number": "030 123456", "type": "work"}]'
      selector:
        object:
    emails:
      required: false
      example: '["weber@example.com"]'
      selector:
        object:
    vip:
      required: false
      default: false
      selector:
        boolean:
    phonebook_id:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
          mode: box

delete_contact:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    contact_id:
      required: true
      example: "12"
      selector:
        text:
    phonebook_id:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
          mode: box

add_number_to_contact:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    contact_id:
      required: true
      example: "12"
      selector:
        text:
    number:
      required: true
      example: "030 123456"
      selector:
        text:
    number_type:
      required: false
      default: home
      selector:
        select:
          options:
            - home
            - mobile
            - work
            - fax_work
            - other
    phonebook_id:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 999
          mode: box

block_number:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    number:
      required: true
      example: "030 123456"
      selector:
        text:
    name:
      required: false
      example: "Gewinnspiel-Zentrale"
      selector:
        text:

unblock_number:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    number:
      required: true
      example: "030 123456"
      selector:
        text:
