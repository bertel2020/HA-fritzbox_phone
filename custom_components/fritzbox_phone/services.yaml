mark_message_read:
  target:
    entity:
      integration: fritzbox_phone
      domain: sensor
  fields:
    message_index:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 999
          mode: box
    read:
      required: false
      default: true
      selector:
        boolean:

delete_message:
  target:
    entity:
      integration: fritzbox_phone
      domain: sensor
  fields:
    message_index:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 999
          mode: box

download_message:
  target:
    entity:
      integration: fritzbox_phone
      domain: sensor
  fields:
    message_index:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 999
          mode: box
    filename:
      required: true
      example: nachricht_3.mp3
      selector:
        text:

dial:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    number:
      required: true
      example: "030 123456"
      selector:
        text:

hangup:
  target:
    entity:
      integration: fritzbox_phone

lookup_number:
  target:
    entity:
      integration: fritzbox_phone
  fields:
    number:
      required: true
      example: "+49 30 123456"
      selector:
        text:
