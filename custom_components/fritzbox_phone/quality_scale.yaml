# Self-assessment against the Home Assistant integration quality scale.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# "todo" means not done or not verified yet.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: todo
    comment: Not verified that every entity turns unavailable when the box is unreachable.
  integration-owner: done
  log-when-unavailable:
    status: todo
    comment: Not verified that an outage is logged once and its recovery once.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: Measured in CI, currently 85% (api.py 59%, logbook.py 30%); the target is 95%.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update:
    status: todo
    comment: Polling interval is documented; the call monitor push path is only partly.
  docs-examples: done
  docs-known-limitations:
    status: todo
    comment: No dedicated section yet.
  docs-supported-devices:
    status: todo
    comment: No list of tested FRITZ!Box models.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: No entity is disabled by default yet; diagnostic sensors could be.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: todo
    comment: Removed answering machines and phonebooks are not cleaned from the registry.

  # Platinum
  async-dependency:
    status: todo
    comment: fritzconnection is synchronous (requests) and runs in the executor.
  inject-websession:
    status: todo
    comment: PhoneBlock and Tellows use the shared session; fritzconnection does not.
  strict-typing:
    status: todo
    comment: No mypy run and no py.typed marker.
