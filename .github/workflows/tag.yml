name: Tag release

# Tags the commit on main as soon as manifest.json carries a version that has
# no tag yet, then hands over to the Release workflow. A tag pushed with the
# default token does not trigger other workflows, hence the explicit dispatch.
on:
  push:
    branches:
      - main
    paths:
      - custom_components/fritzbox_phone/manifest.json

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Create tag and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tag if the version is new
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/fritzbox_phone/manifest.json)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' ist keine gültige Version."
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag existiert bereits, nichts zu tun."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $version"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Start release workflow
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml -f tag="$TAG"
