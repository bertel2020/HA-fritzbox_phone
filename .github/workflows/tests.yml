name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Integration tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: pytest

  card:
    name: Card tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/card/package-lock.json
      - name: Install dependencies
        working-directory: tests/card
        run: npm ci
      - name: Syntax check
        run: node --check custom_components/fritzbox_phone/www/fritzbox-phone-card.js
      - name: Test
        working-directory: tests/card
        run: npm test
